<style>
    :root {
        --acc: var(--accent-color, #00cdab);
        --fg: var(--content-color, #1a1a1a);
        --hot: #e5484d;
        --cold: #3b82f6;
        --box: rgba(128, 128, 128, .08);
        --stroke: rgba(128, 128, 128, .45);
        --elec: #6b7f8c;
        --heat: #f2994a;
    }
    @media (prefers-color-scheme: dark) {
        :root { --fg: var(--content-color, #f0f0f0); }
    }
    html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--fg);
        font-family: var(--font-family, "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    #tile {
        box-sizing: border-box;
        /* 100vh = Höhe der Kachel, auch wenn Symcon keine Höhe an html/body vorgibt */
        height: 100vh;
        /* oben Platz für den Titel und das Vergrößern-Symbol, die Symcon selbst zeichnet */
        padding: 58px 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    /* ---------- Kennzahlen ---------- */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
    .kpis .kpi .value { font-size: 13.5px; }
    .kpi.error .value { color: var(--hot); font-weight: 600; }
    .kpi.noerror .value { color: var(--acc); }

    /* ---------- Vergleich Pumpe / eigene Messung ---------- */
    #cmp { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    #cmp th { font-size: 10.5px; font-weight: 400; opacity: .6; text-align: right; padding: 0 6px 2px; white-space: nowrap; }
    #cmp th:first-child, #cmp td:first-child, #cmp th.src { text-align: left; padding-left: 8px; }
    #cmp td { text-align: right; padding: 3px 6px; white-space: nowrap; border-top: 1px solid rgba(128, 128, 128, .15); }
    #cmp td.src { font-size: 10px; opacity: .55; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    #cmp td.dev { font-weight: 600; }
    #cmp .ok { color: var(--acc); }
    #cmp .warn { color: #f2994a; }
    #cmp .bad { color: var(--hot); }
    @media (max-width: 520px) {
        #cmp td.src, #cmp th.src { display: none; }
    }
    .kpi { min-width: 0; padding: 5px 8px; border-radius: 8px; background: var(--box); }
    .kpi .label { font-size: 11px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi .value { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi.cop .value { color: var(--acc); }
    @media (max-width: 440px) {
        .kpi .value { font-size: 14px; }
    }
    .kpi[hidden] { display: none; }

    /* ---------- Anlagenschema ---------- */
    #schema { flex: 1; min-height: 0; width: 100%; display: block; }
    .kpi.defrost.active .value { color: var(--cold); }

    /* ---------- Umschalter Anlage / Verlauf ---------- */
    .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .view[hidden] { display: none; }
    .tabs { display: flex; gap: 4px; align-items: center; }
    .tabs button {
        border: 1px solid rgba(128, 128, 128, .3); background: transparent; color: inherit; font: inherit;
        font-size: 11px; padding: 3px 10px; border-radius: 12px; cursor: pointer;
    }
    .tabs button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
    .tabs .spacer { flex: 1; }

    /* ---------- Tagesdiagramm ---------- */
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; opacity: .75; margin: 4px 0 2px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    .legend .l-elec { background: var(--elec); }
    .legend .l-heat { background: var(--heat); }
    .legend .l-temp { height: 3px; vertical-align: 2px; background: var(--cold); }
    .chart-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
    #daily { flex: 1; width: 100%; min-height: 0; display: block; touch-action: pan-y; }
    #daily text { fill: var(--fg); font-size: 10px; opacity: .6; }
    #daily .grid { stroke: rgba(128, 128, 128, .22); stroke-width: 1; }
    #daily .b-elec { fill: var(--elec); }
    #daily .b-heat { fill: var(--heat); }
    #daily .partial { opacity: .45; }
    #daily .temp { fill: none; stroke: var(--cold); stroke-width: 2; stroke-linejoin: round; }
    #daily .tdot { fill: var(--cold); }
    #daily .cursor { fill: rgba(128, 128, 128, .12); }
    #dTip {
        position: absolute; top: 4px; padding: 5px 8px; border-radius: 6px; background: rgba(30, 30, 30, .88); color: #fff;
        font-size: 11px; line-height: 1.45; white-space: nowrap; pointer-events: none; display: none;
    }
    #dEmpty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 12px; opacity: .6; text-align: center; }
    #schema text { fill: var(--fg); font-size: 9px; }
    #schema .small { font-size: 7.5px; opacity: .65; }
    #schema .title { font-size: 10px; font-weight: 600; }
    #schema .center { text-anchor: middle; }
    #schema .unit-box { fill: var(--box); stroke: var(--stroke); stroke-width: 1; }
    #schema .fan-ring { fill: none; stroke: var(--stroke); stroke-width: 1.5; }
    #schema .blade { fill: var(--fg); opacity: .5; }
    #schema .pipe-bg { fill: none; stroke-width: 9; stroke-linecap: round; opacity: .13; }
    #schema .pipe { fill: none; stroke-width: 5; stroke-linecap: round; }
    #schema .hot { stroke: var(--hot); }
    #schema .cold { stroke: var(--cold); }
    #schema .tank-shell { fill: none; stroke: var(--stroke); stroke-width: 1.5; }
    #schema .tank-temp { fill: #fff; font-size: 11px; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: rgba(0, 0, 0, .25); stroke-width: 2px; }
    /* Umwälzpumpe: Laufrad dreht sich, Ring pulsiert, solange Wasser fließt */
    #schema .pump { fill: #fff; stroke: var(--cold); stroke-width: 1.6; }
    #schema .pump-ring { fill: none; stroke: var(--cold); stroke-width: 1.2; opacity: 0; transform-box: fill-box; transform-origin: center; }
    #schema .blade-p { fill: none; stroke: var(--cold); stroke-width: 1.8; stroke-linecap: round; }
    #schema .hub { fill: var(--cold); }
    #impeller { transform-box: fill-box; transform-origin: center; }
    @keyframes ripple { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.9); opacity: 0; } }
    #schema.running #impeller { animation: spin .9s linear infinite; }
    #schema.running .pump-ring { animation: ripple 1.8s ease-out infinite; }
    #schema.running .pump-ring.r2 { animation-delay: .9s; }
    #schema .fbh { fill: none; stroke: #f2994a; stroke-width: 2.5; stroke-linejoin: round; }
    #schema .buffer-fill { stroke: none; }
    /* Y-Ventil: Zeiger dreht beim Umschalten in die aktive Richtung, aktiver Ausgang pulsiert */
    #schema .valve-port { fill: #fff; stroke: var(--fg); stroke-width: 1; stroke-opacity: .45; transition: fill .5s, stroke .5s; }
    #schema .valve-port.active { fill: var(--hot); stroke: var(--hot); stroke-opacity: 1; }
    #valveIndicator { transform-box: fill-box; transform-origin: center; transition: transform .8s cubic-bezier(.5, -0.4, .3, 1.4); }
    #valveIndicator.heat { transform: rotate(-90deg); }
    #schema .valve-hub { fill: #fff; stroke: var(--fg); stroke-width: 1; stroke-opacity: .6; }
    #schema .valve-arm { stroke: var(--fg); stroke-width: 2.4; stroke-linecap: round; }
    @keyframes portPulse { 50% { opacity: .55; } }
    #schema.running .valve-port.active { animation: portPulse 1.6s ease-in-out infinite; }
    #schema .on-tank { fill: #fff; opacity: .9; }
    /* Zweig, auf den das Y-Ventil gerade nicht geschaltet ist */
    #schema .pipe.inactive { stroke: var(--stroke); animation: none !important; }
    #schema .glint.inactive { opacity: 0 !important; animation: none !important; }
    #schema .glint.core.inactive { opacity: .15 !important; }
    #schema .pipe-bg.inactive { opacity: 0; }

    /* Strömung: laufende Striche auf den Leitungen, wenn die Pumpe läuft */
    /* Strömung: durchgehende Leitung, darüber zwei weiche Lichtreflexe, die in Fließrichtung wandern
       (breit + blass und schmal + heller ergibt einen schimmernden Verlauf – ohne SVG-Verläufe/Filter) */
    /* Rohre: feine Glanzlinie (wie ein rundes Rohr), darüber ein breiter, weicher Schimmer und
       kleine Wasserperlen, die in Fließrichtung wandern – ohne SVG-Verläufe/Filter */
    @keyframes sheen { to { stroke-dashoffset: -110; } }
    @keyframes beads { to { stroke-dashoffset: -28; } }
    #schema .glint { fill: none; stroke: #fff; stroke-linecap: round; pointer-events: none; transition: opacity 1s ease; }
    #schema .glint.core { stroke-width: 1.2; opacity: .35; transform: translateY(-1px); }
    #schema .glint.sheen { stroke-width: 5; stroke-dasharray: 34 76; opacity: 0; }
    #schema .glint.beads { stroke-width: 2.4; stroke-dasharray: .01 14; opacity: 0; }
    #schema.running .glint.sheen:not(.inactive) { opacity: .22; animation: sheen 3.2s linear infinite; }
    #schema.running .glint.beads:not(.inactive) { opacity: .85; animation: beads 1.1s linear infinite; }

    /* Lüfter dreht sich im Betrieb */
    @keyframes spin { to { transform: rotate(360deg); } }
    #fan { transform-box: fill-box; transform-origin: center; }
    #schema.heating #fan { animation: spin 1.6s linear infinite; }
    #schema.heating .blade { fill: var(--acc); opacity: .9; }
    #schema.heating .fan-ring { stroke: var(--acc); }
</style>

<script>
    const $ = (id) => document.getElementById(id);
    const NS = 'http://www.w3.org/2000/svg';
    let values = {};

    const f = (key) => values[key] ? values[key].f : '–';          // formatiert (Profil)
    const n = (key) => values[key] ? Number(values[key].v) : null;  // Zahl
    const has = (key) => key in values;

    // Temperatur -> Farbe: 15 °C blau, 38 °C orange, 55 °C rot
    const STOPS = [[15, [59, 130, 246]], [38, [242, 153, 74]], [55, [229, 72, 77]]];
    function tempColor(t) {
        if (t === null || isNaN(t)) return 'rgba(128,128,128,.3)';
        if (t <= STOPS[0][0]) return `rgb(${STOPS[0][1]})`;
        for (let i = 1; i < STOPS.length; i++) {
            const [t0, c0] = STOPS[i - 1], [t1, c1] = STOPS[i];
            if (t <= t1) {
                const p = (t - t0) / (t1 - t0);
                return `rgb(${c0.map((c, j) => Math.round(c + (c1[j] - c) * p))})`;
            }
        }
        return `rgb(${STOPS[STOPS.length - 1][1]})`;
    }

    // Speicher mit Schichtung zeichnen (oben -> unten); fehlt ein Fühler, wird der andere verwendet
    function drawTank(groupId, x, y, w, h, r, top, bottom) {
        const g = $(groupId);
        g.innerHTML = '';
        const t1 = top !== null ? top : bottom, t2 = bottom !== null ? bottom : top;
        const steps = 60;
        // Ersatz für einen Clip-Pfad: schmale Streifen, in den Rundungen jeweils so weit eingerückt,
        // dass die äußere Kante des Streifens noch innerhalb der Rundung liegt
        const insetAt = (yy) => yy < y + r ? r - Math.sqrt(Math.max(0, r * r - (y + r - yy) ** 2))
            : yy > y + h - r ? r - Math.sqrt(Math.max(0, r * r - (yy - (y + h - r)) ** 2)) : 0;
        for (let i = 0; i < steps; i++) {
            const sy = y + i * h / steps, sh = h / steps + 0.4;
            const t = t1 === null ? null : t1 + (t2 - t1) * (i / (steps - 1));
            const inset = Math.max(insetAt(sy + 0.75), insetAt(Math.min(y + h - 0.75, sy + sh)));
            const rect = document.createElementNS(NS, 'rect');
            rect.setAttribute('x', x + inset + 0.75);
            rect.setAttribute('y', sy);
            rect.setAttribute('width', Math.max(0, w - 2 * inset - 1.5));
            rect.setAttribute('height', sh);
            rect.setAttribute('fill', tempColor(t));
            g.appendChild(rect);
        }
    }

    // ---------- Tagesdiagramm: Strom und Wärme je Tag (Balken), Außentemperatur (Linie) ----------
    let daily = [], days = 14, dGeo = null;
    const num = (v, d) => v === null || v === undefined ? '–' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
    const niceCeil = (v) => { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; };
    function svgEl(name, attrs, parent) {
        const e = document.createElementNS(NS, name);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        parent.appendChild(e);
        return e;
    }

    function drawDaily() {
        const svg = $('daily');
        const W = svg.clientWidth, H = svg.clientHeight;
        svg.innerHTML = '';
        if (W < 60 || H < 50) return;
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        const data = daily.slice(-days);
        $('dEmpty').style.display = data.some(d => d.e !== null || d.h !== null || d.t !== null) ? 'none' : 'flex';

        const L = 36, R = 32, T = 8, B = 20;
        const n = days, slot = (W - L - R) / n;
        const eMax = niceCeil(Math.max(1, ...data.map(d => Math.max(d.e || 0, d.h || 0))));
        const temps = data.map(d => d.t).filter(t => t !== null);
        let tMin = temps.length ? Math.floor(Math.min(...temps) / 5) * 5 : -5;
        let tMax = temps.length ? Math.ceil(Math.max(...temps) / 5) * 5 : 15;
        if (tMax - tMin < 10) tMax = tMin + 10;
        const yE = (v) => H - B - v / eMax * (H - T - B);
        const yT = (v) => H - B - (v - tMin) / (tMax - tMin) * (H - T - B);
        const off = n - data.length; // fehlende Tage links leer lassen
        const xs = (i) => L + (i + off) * slot;

        for (let i = 0; i <= 4; i++) {
            const y = T + i * (H - T - B) / 4;
            svgEl('line', { x1: L, x2: W - R, y1: y, y2: y, class: 'grid' }, svg);
            svgEl('text', { x: L - 4, y: y + 3, 'text-anchor': 'end' }, svg).textContent = num(eMax * (4 - i) / 4, 0);
            svgEl('text', { x: W - R + 4, y: y + 3 }, svg).textContent = num(tMax - i * (tMax - tMin) / 4, 0) + '°';
        }
        const bw = Math.max(1.5, slot * 0.36);
        const labelEvery = Math.max(1, Math.ceil(36 / slot)); // Datum braucht ca. 36 px
        data.forEach((d, i) => {
            const x = xs(i);
            const cls = d.p ? ' partial' : '';
            if (d.e !== null) svgEl('rect', { x: x + slot / 2 - bw - 0.5, y: yE(d.e), width: bw, height: H - B - yE(d.e), class: 'b-elec' + cls, rx: 1 }, svg);
            if (d.h !== null) svgEl('rect', { x: x + slot / 2 + 0.5, y: yE(d.h), width: bw, height: H - B - yE(d.h), class: 'b-heat' + cls, rx: 1 }, svg);
            if ((data.length - 1 - i) % labelEvery === 0) {
                const dt = new Date(d.d + 'T12:00');
                svgEl('text', { x: x + slot / 2, y: H - 5, 'text-anchor': 'middle' }, svg).textContent = d.p ? 'heute' : dt.getDate() + '.' + (dt.getMonth() + 1) + '.';
            }
        });
        let path = '';
        data.forEach((d, i) => {
            if (d.t === null) return;
            path += (path ? 'L' : 'M') + (xs(i) + slot / 2).toFixed(1) + ' ' + yT(d.t).toFixed(1) + ' ';
        });
        if (path) svgEl('path', { d: path, class: 'temp' }, svg);
        data.forEach((d, i) => { if (d.t !== null) svgEl('circle', { cx: xs(i) + slot / 2, cy: yT(d.t), r: 2.5, class: 'tdot' }, svg); });
        dGeo = { data, xs, slot, T, B, H, W };
    }

    function showDailyTip(e) {
        if (!dGeo) return;
        const r = $('daily').getBoundingClientRect();
        const px = e.clientX - r.left;
        const i = dGeo.data.findIndex((d, k) => px >= dGeo.xs(k) && px < dGeo.xs(k) + dGeo.slot);
        $('daily').querySelectorAll('.cursor').forEach(c => c.remove());
        if (i < 0) return hideDailyTip();
        const d = dGeo.data[i];
        const cur = svgEl('rect', { x: dGeo.xs(i), y: dGeo.T, width: dGeo.slot, height: dGeo.H - dGeo.T - dGeo.B, class: 'cursor' }, $('daily'));
        $('daily').insertBefore(cur, $('daily').firstChild);
        const dt = new Date(d.d + 'T12:00');
        const az = d.e && d.h !== null && d.e > 0.2 ? num(d.h / d.e, 2) : '–';
        const tip = $('dTip');
        tip.innerHTML = `<b>${dt.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' })}${d.p ? ' (bis jetzt)' : ''}</b><br>`
            + `Außen Ø ${num(d.t, 1)} °C (${num(d.tmin, 1)} … ${num(d.tmax, 1)})<br>`
            + `Strom ${num(d.e, 1)} kWh · Wärme ${num(d.h, 1)} kWh<br>`
            + `Arbeitszahl ${az} · Abtauungen ${d.df ?? '–'} (${num(d.dfe, 2)} kWh)`;
        tip.style.display = 'block';
        const cx = dGeo.xs(i) + dGeo.slot / 2;
        tip.style.left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), r.width - tip.offsetWidth) + 'px';
    }
    function hideDailyTip() {
        $('dTip').style.display = 'none';
        $('daily').querySelectorAll('.cursor').forEach(c => c.remove());
    }
    $('daily').addEventListener('pointermove', showDailyTip);
    $('daily').addEventListener('pointerdown', showDailyTip);
    $('daily').addEventListener('pointerleave', hideDailyTip);

    // Umschalter Anlage / Verlauf (Auswahl wird im Browser gemerkt)
    function showView(name) {
        $('viewSchema').hidden = name !== 'schema';
        $('viewDaily').hidden = name !== 'daily';
        $('tabSchema').classList.toggle('on', name === 'schema');
        $('tabDaily').classList.toggle('on', name === 'daily');
        $('rangeBtns').hidden = name !== 'daily';
        try { localStorage.setItem('hwpView', name); } catch (e) {}
        if (name === 'daily') drawDaily();
    }
    $('tabSchema').addEventListener('click', () => showView('schema'));
    $('tabDaily').addEventListener('click', () => showView('daily'));
    document.querySelectorAll('#rangeBtns button').forEach(b => b.addEventListener('click', () => {
        days = Number(b.dataset.days);
        document.querySelectorAll('#rangeBtns button').forEach(x => x.classList.toggle('on', x === b));
        drawDaily();
    }));
    window.addEventListener('resize', () => { if (!$('viewDaily').hidden) drawDaily(); });

    // Lichtreflexe: zu jeder Leitung zwei Overlay-Pfade (breit/schmal) mit gleichem Verlauf und Zustand
    const glints = new Map();
    function syncGlints() {
        document.querySelectorAll('#schema .pipe').forEach(pipe => {
            if (pipe.closest('[style*="display: none"]')) {
                (glints.get(pipe) || []).forEach(g => g.classList.add('inactive'));
                return;
            }
            if (!glints.has(pipe)) {
                const pair = ['core', 'sheen', 'beads'].map(cls => {
                    const g = document.createElementNS(NS, 'path');
                    g.setAttribute('class', 'glint ' + cls);
                    pipe.parentNode.insertBefore(g, pipe.nextSibling);
                    return g;
                });
                glints.set(pipe, pair);
            }
            glints.get(pipe).forEach(g => {
                g.setAttribute('d', pipe.getAttribute('d'));
                g.classList.toggle('inactive', pipe.classList.contains('inactive'));
            });
        });
    }

    // Wird von IP-Symcon aufgerufen (Startwert + jede Änderung eines Datenpunkts)
    function handleMessage(data) {
        const msg = typeof data === 'string' ? JSON.parse(data) : data;
        values = msg.values || {};

        document.querySelectorAll('.kpi[data-key]').forEach(k => {
            k.hidden = !has(k.dataset.key);
            k.querySelector('.value').textContent = f(k.dataset.key);
        });

        $('tStatus').textContent = has('WFAStatus') ? f('WFAStatus') : has('WEZStatus') ? f('WEZStatus') : '';
        $('tWezSoll').textContent = f('WEZSetpoint');
        $('tWezIst').textContent = f('WEZPower');
        $('tWezPower').textContent = f('Hours');
        // Abtauungen heute: Anzahl und Strom
        const df = msg.defrost;
        $('dfBox').hidden = !df;
        if (df) {
            $('dfValue').textContent = df.active ? 'läuft …' : `${df.today} · ${num(df.elec, 2)} kWh`;
            $('dfBox').classList.toggle('active', !!df.active);
        }
        daily = msg.daily || [];
        if (!$('viewDaily').hidden) drawDaily();
        const err = $('errBox');
        err.classList.toggle('error', !!msg.error);
        err.classList.toggle('noerror', has('ErrorCode') && !msg.error);
        $('tFlow').textContent = f('FlowTemp');
        $('tReturn').textContent = f('ReturnTemp');
        $('tFlowRate').textContent = has('FlowRate') ? f('FlowRate') : '';
        $('tPump').textContent = has('PumpSpeed') ? 'Pumpe ' + f('PumpSpeed') : '';
        $('tTop').textContent = f('StorageTop');
        $('tBottom').textContent = f('StorageBottom');
        $('tDhw').textContent = has('DHWSetpoint') ? 'Soll ' + f('DHWSetpoint') : '';
        // Puffer: oben/unten (PF1/PF2) oder ein Fühler (WPF)
        const bufTop = n('BufferTop') ?? n('BufferTemp'), bufBottom = n('BufferBottom') ?? n('BufferTemp');
        const hasBuf = bufTop !== null || bufBottom !== null;
        $('tBufTop').textContent = has('BufferTop') ? f('BufferTop') : '';
        $('tBufBottom').textContent = has('BufferBottom') ? f('BufferBottom') : '';
        $('tBufMid').textContent = !has('BufferTop') && !has('BufferBottom') && has('BufferTemp') ? f('BufferTemp') : '';
        $('tBufTitle').style.fill = $('tBufMid').style.fill = hasBuf ? '#fff' : '';
        drawTank('bufferSlices', 296, 40, 52, 136, 12, bufTop, bufBottom);
        // ohne Puffer: Heizungszweig direkt vom Ventil zur FBH und von dort zurück
        $('bufferGroup').style.display = hasBuf ? '' : 'none';
        const heatPath = hasBuf ? 'M160 48 V16 H322 V40' : 'M160 48 V16 H372 V62';
        $('pipeHeat').setAttribute('d', heatPath);
        $('bgHeat').setAttribute('d', heatPath);
        $('pipeRetHeat').setAttribute('d', hasBuf ? 'M322 176 V218 H224' : 'M372 142 H360 V218 H224');
        $('bgRetHeat').setAttribute('d', hasBuf ? 'M322 176 V218 H58 V206' : 'M372 142 H360 V218 H58 V206');
        $('tHc1').textContent = has('HC1FlowTemp') ? 'VL ' + f('HC1FlowTemp') : '';
        $('tRoom').textContent = has('RoomSetpoint') ? 'Raum Soll ' + f('RoomSetpoint') : '';
        drawTank('tankSlices', 196, 34, 56, 162, 14, n('StorageTop'), n('StorageBottom'));

        // Vergleichstabelle: Abweichung grün < 10 %, orange < 25 %, sonst rot
        const tbody = document.querySelector('#cmp tbody');
        tbody.innerHTML = '';
        for (const [label, pump, own, src, dev] of msg.rows || []) {
            const tr = document.createElement('tr');
            const cls = dev === null ? '' : Math.abs(dev) < 10 ? 'ok' : Math.abs(dev) < 25 ? 'warn' : 'bad';
            const devText = dev === null ? '–' : (dev > 0 ? '+' : '') + Number(dev).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
            for (const [text, className] of [[label, ''], [pump, ''], [own, ''], [src, 'src'], [devText, 'dev ' + cls]]) {
                const td = document.createElement('td');
                td.textContent = text;
                td.className = className;
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }
        $('cmp').style.display = (msg.rows || []).length ? '' : 'none';

        // Y-Ventil: aktiven Zweig hervorheben, den anderen ausgrauen
        const valve = msg.valve; // "ww" oder "heat"
        const wwOff = valve === 'heat', heatOff = valve === 'ww';
        ['pipeWW', 'bgWW', 'pipeRetWW'].forEach(id => $(id).classList.toggle('inactive', wwOff));
        ['pipeHeat', 'bgHeat', 'pipeRetHeat'].forEach(id => $(id).classList.toggle('inactive', heatOff));
        $('portWW').classList.toggle('active', valve === 'ww');
        $('portHeat').classList.toggle('active', valve === 'heat');
        $('tValve').textContent = valve === 'ww' ? 'Ventil: Warmwasser' : 'Ventil: Heizung';
        $('valveIndicator').classList.toggle('heat', valve !== 'ww');

        // Betrieb erkennen: Pumpe/Volumenstrom -> Strömung, Leistung -> Lüfter
        const pumping = (n('PumpSpeed') || 0) > 0 || (n('FlowRate') || 0) > 0 || n('HC1Pump') === 1;
        $('schema').classList.toggle('running', pumping);
        $('schema').classList.toggle('heating', !!msg.heating);
        syncGlints();
    }
    try { if (localStorage.getItem('hwpView') === 'daily') showView('daily'); } catch (e) {}
</script>
