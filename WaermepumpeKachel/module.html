<style>
    :root {
        --acc: var(--accent-color, #00cdab);
        --fg: var(--content-color, #1a1a1a);
        --temp: #f2994a;
        --peak: #e5484d;
        --line: rgba(128, 128, 128, .22);
    }
    @media (prefers-color-scheme: dark) {
        :root { --fg: var(--content-color, #f0f0f0); }
    }
    html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--fg);
        font-family: var(--font-family, "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    #tile {
        box-sizing: border-box;
        /* 100vh = Höhe der Kachel, auch wenn Symcon keine Höhe an html/body vorgibt */
        height: 100vh;
        /* oben Platz für den Titel und das Vergrößern-Symbol, die Symcon selbst zeichnet */
        padding: 58px 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* ---------- Aktuelle Leistung (Rundanzeige) + Kennzahlen ---------- */
    .top {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 8px;
        align-items: stretch;
    }
    .gauge {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4px 6px;
        border-radius: 8px;
        background: rgba(128, 128, 128, .08);
    }
    .gauge .label { font-size: 11px; opacity: .65; }
    .gauge svg { width: 100%; max-height: 90px; display: block; }
    #gTrack, #gFill { fill: none; stroke-width: 9; stroke-linecap: round; }
    #gTrack { stroke: var(--acc); opacity: .2; }
    #gFill { stroke: var(--acc); transition: stroke-dasharray .6s ease; }
    #gValue { fill: var(--fg); font-size: 17px; text-anchor: middle; font-variant-numeric: tabular-nums; }
    #gState, .gScale { fill: var(--fg); font-size: 8.5px; opacity: .6; text-anchor: middle; }
    .kpis {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }
    .kpi {
        min-width: 0;
        padding: 6px 8px;
        border-radius: 8px;
        background: rgba(128, 128, 128, .08);
    }
    .kpi .label { font-size: 11px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi .value { font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .kpi .sub { font-size: 11px; opacity: .65; white-space: nowrap; }
    .kpi.power .value { color: var(--acc); }
    .kpi.temp .value { color: var(--temp); }
    .kpi.peak .value { color: var(--peak); }
    @media (max-width: 420px) {
        .top { grid-template-columns: 118px 1fr; }
        .kpi .value { font-size: 15px; }
    }

    /* ---------- Diagramm ---------- */
    .chart-box {
        position: relative;
        flex: 1;
        min-height: 80px;
        display: flex;
        flex-direction: column;
    }
    .legend { display: flex; gap: 14px; font-size: 11px; opacity: .75; margin-bottom: 2px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    .legend .l-power { background: var(--acc); }
    .legend .l-temp { height: 3px; vertical-align: 2px; background: var(--temp); }
    #chart { flex: 1; width: 100%; min-height: 0; display: block; touch-action: pan-y; }
    #chart text { fill: var(--fg); font-size: 10px; opacity: .6; }
    #chart .grid { stroke: var(--line); stroke-width: 1; }
    #chart .bar { fill: var(--acc); opacity: .85; }
    #chart .bar.peak { fill: var(--peak); opacity: 1; }
    #chart .temp { fill: none; stroke: var(--temp); stroke-width: 2; stroke-linejoin: round; }
    #chart .cursor { stroke: var(--fg); stroke-width: 1; opacity: .4; }
    #tooltip {
        position: absolute;
        top: 18px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(30, 30, 30, .85);
        color: #fff;
        font-size: 11px;
        white-space: nowrap;
        pointer-events: none;
        display: none;
    }
    #empty {
        position: absolute;
        inset: 20px 0 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        opacity: .6;
        text-align: center;
    }

    /* ---------- Spitzen der letzten 7 Tage ---------- */
    .peaks-box { flex: none; }
    .peaks-title { font-size: 11px; opacity: .65; margin-bottom: 4px; }
    #peaks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
    .day { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .day .v { font-size: 10px; font-variant-numeric: tabular-nums; opacity: .8; white-space: nowrap; }
    .day .b { width: 100%; max-width: 34px; border-radius: 3px 3px 0 0; background: var(--peak); opacity: .35; }
    .day .d { font-size: 10px; opacity: .6; }
    .day.today .b { opacity: .9; }
    .day.today .d { opacity: 1; font-weight: 600; }
    @media (max-height: 330px) {
        .peaks-box { display: none; }
    }
</style>

<div id="tile">
    <div class="top">
    <div class="gauge">
        <div class="label">Leistung aktuell</div>
        <svg viewBox="0 0 120 74">
            <path id="gTrack" d="M12 62 A48 48 0 0 1 108 62" pathLength="100"/>
            <path id="gFill" d="M12 62 A48 48 0 0 1 108 62" pathLength="100" stroke-dasharray="0 200"/>
            <text id="gValue" x="60" y="52">–</text>
            <text id="gState" x="60" y="66"></text>
            <text class="gScale" x="12" y="73">0</text>
            <text class="gScale" id="gMax" x="108" y="73"></text>
        </svg>
    </div>
    <div class="kpis">
        <div class="kpi power"><div class="label">Leistung Ø 15 min</div><div class="value" id="kPower">–</div></div>
        <div class="kpi temp"><div class="label">Außentemperatur</div><div class="value" id="kTemp">–</div></div>
        <div class="kpi"><div class="label">Heute</div><div class="value" id="kEnergy">–</div><div class="sub" id="kCost"></div></div>
        <div class="kpi peak"><div class="label">Spitze heute</div><div class="value" id="kPeak">–</div><div class="sub" id="kPeakTime"></div></div>
    </div>
    </div>

    <div class="chart-box">
        <div class="legend"><span><i class="l-power"></i>Leistung (kW, Ø 15 min)</span><span><i class="l-temp"></i>Außentemperatur (°C)</span></div>
        <svg id="chart"></svg>
        <div id="tooltip"></div>
        <div id="empty">Noch keine Daten – der erste Wert erscheint nach der nächsten vollen Viertelstunde.</div>
    </div>

    <div class="peaks-box">
        <div class="peaks-title">Höchste 15-min-Leistung je Tag</div>
        <div id="peaks"></div>
    </div>
</div>

<script>
    let state = null;
    const $ = (id) => document.getElementById(id);
    const NS = 'http://www.w3.org/2000/svg';
    const fmt = (v, d = 1) => v === null || v === undefined ? '–'
        : Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
    const unit = (v, d, u) => v === null || v === undefined ? '–' : fmt(v, d) + ' ' + u;
    const hhmm = (ts) => new Date(ts * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

    // Wird von IP-Symcon aufgerufen (Startwert, jede Viertelstunde, bei Zähler-/Temperaturänderung)
    function handleMessage(data) {
        state = typeof data === 'string' ? JSON.parse(data) : data;
        $('kPower').textContent = unit(state.power, 2, 'kW');
        $('kTemp').textContent = unit(state.temperature, 1, '°C');
        $('kEnergy').textContent = unit(state.energyToday, 1, 'kWh');
        $('kCost').textContent = unit(state.costToday, 2, '€');
        $('kPeak').textContent = state.peakToday ? unit(state.peakToday[0], 2, 'kW') : '–';
        $('kPeakTime').textContent = state.peakToday ? 'Ø 15 min · ' + hhmm(state.peakToday[1]) + ' Uhr' : '';
        drawGauge();
        drawChart();
        drawPeaks();
    }

    function el(name, attrs, parent) {
        const e = document.createElementNS(NS, name);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        parent.appendChild(e);
        return e;
    }

    // "schöne" Obergrenze für die Achse, z.B. 2.3 -> 2.5, 3.1 -> 4
    function niceCeil(v) {
        const p = Math.pow(10, Math.floor(Math.log10(v)));
        for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
        return 10 * p;
    }

    let geo = null; // Geometrie für den Tooltip
    function drawChart() {
        const svg = $('chart');
        const W = svg.clientWidth, H = svg.clientHeight;
        svg.innerHTML = '';
        if (!state || W < 50 || H < 40) return;
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        const series = state.series || [];
        $('empty').style.display = series.length ? 'none' : 'flex';

        const L = 34, R = 34, T = 6, B = 18;
        const tEnd = Math.ceil(state.now / 900) * 900, tStart = tEnd - 86400;
        const x = (t) => L + (t - tStart) / 86400 * (W - L - R);

        const pMax = niceCeil(Math.max(0.5, ...series.map(p => p[1])));
        const temps = series.map(p => p[2]).filter(t => t !== null);
        let tMin = temps.length ? Math.floor(Math.min(...temps) / 5) * 5 : -5;
        let tMax = temps.length ? Math.ceil(Math.max(...temps) / 5) * 5 : 15;
        if (tMax - tMin < 10) tMax = tMin + 10;
        const yP = (v) => H - B - v / pMax * (H - T - B);
        const yT = (v) => H - B - (v - tMin) / (tMax - tMin) * (H - T - B);

        // Gitter und Achsen (links kW, rechts °C)
        for (let i = 0; i <= 4; i++) {
            const y = T + i * (H - T - B) / 4;
            el('line', { x1: L, x2: W - R, y1: y, y2: y, class: 'grid' }, svg);
            el('text', { x: L - 4, y: y + 3, 'text-anchor': 'end' }, svg).textContent = fmt(pMax * (4 - i) / 4, pMax < 2 ? 1 : 0);
            el('text', { x: W - R + 4, y: y + 3 }, svg).textContent = fmt(tMax - i * (tMax - tMin) / 4, 0) + '°';
        }
        const step = (W - L - R) < 260 ? 6 : 3; // Stundenbeschriftung
        for (let t = Math.ceil(tStart / 3600) * 3600; t <= tEnd; t += 3600) {
            if (new Date(t * 1000).getHours() % step) continue;
            el('text', { x: x(t), y: H - 4, 'text-anchor': 'middle' }, svg).textContent = hhmm(t).slice(0, 2) + ' h';
        }

        // Balken: mittlere Leistung je Viertelstunde, die Tagesspitze rot
        const bw = Math.max(1, (W - L - R) / 96 - 1);
        const peakStart = state.peakToday ? state.peakToday[1] : null;
        for (const [t, kw] of series) {
            el('rect', { x: x(t) + 0.5, y: yP(kw), width: bw, height: Math.max(0, H - B - yP(kw)), class: 'bar' + (t === peakStart ? ' peak' : '') }, svg);
        }

        // Linie: Außentemperatur (Lücken > 30 min unterbrechen die Linie)
        let d = '', prev = null;
        for (const [t, , temp] of series) {
            if (temp === null) { prev = null; continue; }
            d += (prev === null || t - prev > 1800 ? 'M' : 'L') + (x(t) + bw / 2).toFixed(1) + ' ' + yT(temp).toFixed(1) + ' ';
            prev = t;
        }
        if (d) el('path', { d, class: 'temp' }, svg);

        geo = { x, L, R, W, H, T, B, series, bw };
    }

    // Rundanzeige: Skala bis zur höchsten Leistung der letzten Tage (aufgerundet)
    function drawGauge() {
        const cur = state.current;
        const known = [cur || 0, ...(state.series || []).map(p => p[1]), ...(state.peaks || []).map(p => p[1] || 0)];
        const max = niceCeil(Math.max(1, ...known));
        const p = cur === null || cur === undefined ? 0 : Math.min(100, cur / max * 100);
        $('gFill').setAttribute('stroke-dasharray', p + ' 200');
        $('gFill').style.opacity = p > 0 ? 1 : 0;
        $('gValue').textContent = unit(cur, 2, 'kW');
        $('gState').textContent = cur === null || cur === undefined ? 'warte auf Zähler'
            : cur < 0.05 ? 'Stillstand' : 'in Betrieb';
        $('gMax').textContent = fmt(max, max < 2 ? 1 : 0);
    }

    function drawPeaks() {
        const box = $('peaks');
        box.innerHTML = '';
        const list = state.peaks || [];
        const max = Math.max(0.1, ...list.map(p => p[1] || 0));
        const days = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
        list.forEach(([date, kw, ts], i) => {
            const day = document.createElement('div');
            day.className = 'day' + (i === list.length - 1 ? ' today' : '');
            day.title = kw === null ? date : `${date}: ${fmt(kw, 2)} kW um ${hhmm(ts)} Uhr`;
            const h = kw === null ? 2 : Math.max(3, kw / max * 34);
            day.innerHTML = `<span class="v">${kw === null ? '–' : fmt(kw, 1)}</span>`
                + `<span class="b" style="height:${h}px"></span>`
                + `<span class="d">${i === list.length - 1 ? 'Heute' : days[new Date(date + 'T12:00').getDay()]}</span>`;
            box.appendChild(day);
        });
    }

    // Tooltip: Werte der Viertelstunde unter Finger/Maus
    const chart = $('chart');
    function showTip(e) {
        if (!geo || !geo.series.length) return;
        const r = chart.getBoundingClientRect();
        const px = e.clientX - r.left;
        let best = null;
        for (const p of geo.series) {
            const dx = Math.abs(geo.x(p[0]) + geo.bw / 2 - px);
            if (!best || dx < best.dx) best = { dx, p };
        }
        if (!best || best.dx > 20) return hideTip();
        const [t, kw, temp] = best.p;
        const cx = geo.x(t) + geo.bw / 2;
        chart.querySelectorAll('.cursor').forEach(c => c.remove());
        el('line', { x1: cx, x2: cx, y1: geo.T, y2: geo.H - geo.B, class: 'cursor' }, chart);
        const tip = $('tooltip');
        tip.textContent = `${hhmm(t)}–${hhmm(t + 900)}  ·  ${fmt(kw, 2)} kW  ·  ${fmt(temp, 1)} °C`;
        tip.style.display = 'block';
        tip.style.left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), r.width - tip.offsetWidth) + 'px';
    }
    function hideTip() {
        $('tooltip').style.display = 'none';
        chart.querySelectorAll('.cursor').forEach(c => c.remove());
    }
    chart.addEventListener('pointermove', showTip);
    chart.addEventListener('pointerdown', showTip);
    chart.addEventListener('pointerleave', hideTip);

    window.addEventListener('resize', () => { drawChart(); });
</script>
